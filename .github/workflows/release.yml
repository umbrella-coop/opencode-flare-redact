name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      otp:
        description: 'npm one-time password (2FA) — only needed if NPM_TOKEN does not bypass 2FA'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check lockstep versions
        run: pnpm check-versions

      - name: Create/update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Merging the version PR lands a commit titled 'chore(release): version
      # packages' on main; that is the signal to publish.
      - name: Publish (npm + tag + GitHub release)
        if: |
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.event.head_commit.message, 'chore(release): version packages')
        uses: ./.github/workflows/publish.yml
        with:
          otp: ${{ inputs.otp || '' }}
        secrets: inherit
