name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      otp:
        description: 'npm one-time password (2FA) for publishing — leave empty unless npm requires it'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check lockstep versions
        run: pnpm check-versions

      - name: Guard against missing npm publish token
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: |
          echo "::error::NPM_TOKEN secret is not configured. Release will be tagged but NOT published to npm."
          echo "Add the NPM_TOKEN repository secret (scope @umbrella-coop, access: public) and re-run."
          exit 1

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ inputs.otp || '' }}

      - name: Tag and create GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./pkg/core/package.json').version")"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} already exists — skipping"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
            echo "created v${VERSION} tag + release"
          fi
